services:

  # ── Redis — session memory ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mediai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Chroma — vector store ──────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    container_name: mediai_chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: [ "CMD", "perl", "-e", "use Socket; socket(S, PF_INET, SOCK_STREAM, getprotobyname('tcp')); connect(S, sockaddr_in(8000, inet_aton('127.0.0.1'))) or exit 1;" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── FastAPI — main application ─────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mediai_api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    # Keep .env at project root (so both Docker and local dev tools can use it).
    # In docker-compose.yml, reference it with ../.env since the file lives one level up.
    environment:
      - REDIS_URL=redis://redis:6379
      - CHROMA_MODE=http
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - KNOWLEDGE_DIR=/app/knowledge
      - CHUNK_SIZE=${CHUNK_SIZE:-512}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-64}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      - MAX_REFLECTION_ITERATIONS=${MAX_REFLECTION_ITERATIONS:-2}
      - LANGCHAIN_TRACING_V2=true
    volumes:
      - ../app:/app/app
      - ../frontend:/app/frontend
      - ../knowledge:/app/knowledge
      - ../eval:/app/eval

    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  chroma_data:
